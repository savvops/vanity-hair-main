media:
  - name: images
    label: Images
    input: public/images
    output: /images
    categories:
      - image
  - name: videos
    label: Videos
    input: public/videos
    output: /videos
    categories:
      - video
content:
  - name: siteSettings
    label: Site Settings
    path: src/content/siteSettings/settings.json
    type: file
    fields:
      - name: id
        type: string
        hidden: true
        default: settings
      - name: siteName
        label: Site Name
        type: string
      - name: description
        label: Description
        type: string
      - name: logo
        label: Logo
        type: image
        options:
          media: images
      - name: favicon
        label: Favicon
        type: image
        options:
          media: images
      - name: phone
        label: Phone
        type: string
      - name: email
        label: Email
        type: string
      - name: address
        label: Address
        type: string
    format: json
  - name: navigation
    label: Navigation
    path: src/content/navigation/main.json
    type: file
    fields:
      - name: id
        type: string
        hidden: true
        default: main
      - name: brandName
        label: Brand Name
        type: string
      - name: ctaButton
        label: CTA Button
        type: string
      - name: navLinks
        label: Nav Links
        type: object
        fields:
          - name: href
            label: URL
            type: string
          - name: label
            label: Label
            type: string
          - name: order
            label: Order
            type: number
          - name: enabled
            label: Enabled
            type: boolean
        list: true
    format: json
  - name: infoBanner
    label: Info Banner
    path: src/content/infoBanner/items.json
    type: file
    fields:
      - name: id
        type: string
        hidden: true
        default: items
      - name: items
        label: Items
        type: object
        fields:
          - name: icon
            label: Icon
            type: string
          - name: title
            label: Title
            type: string
          - name: content
            label: Content
            type: string
        list: true
    format: json
  - name: hero
    label: Hero Section
    path: src/content/hero/hero.json
    type: file
    fields:
      - name: id
        type: string
        hidden: true
        default: hero
      - name: badge
        label: Badge
        type: string
      - name: headlineLine1
        label: Headline Line 1
        type: string
      - name: headlineAccent
        label: Headline Accent
        type: string
      - name: subheadline
        label: Subheadline
        type: string
      - name: ctaPrimary
        label: Primary CTA
        type: string
      - name: ctaSecondary
        label: Secondary CTA
        type: string
      - name: backgroundImage
        label: Background Image
        type: image
        options:
          media: images
    format: json
  - name: about
    label: About Section
    path: src/content/about/about.json
    type: file
    fields:
      - name: id
        type: string
        hidden: true
        default: about
      - name: subtitle
        label: Subtitle
        type: string
      - name: headlinePart1
        label: Headline Part 1
        type: string
      - name: headlineAccent
        label: Headline Accent
        type: string
      - name: paragraphs
        label: Paragraphs
        type: object
        fields:
          - name: text
            label: Text
            type: string
        list: true
      - name: features
        label: Features
        type: object
        fields:
          - name: feature
            label: Feature
            type: string
        list: true
      - name: signature
        label: Signature
        type: string
      - name: image
        label: Image
        type: image
        options:
          media: images
    format: json
  - name: services
    label: Services
    path: src/content/services
    type: collection
    fields:
      - name: id
        type: string
        hidden: true
        required: false
      - name: title
        label: Title
        type: string
      - name: price
        label: Price
        type: string
      - name: description
        label: Description
        type: string
      - name: icon
        label: Icon
        type: string
      - name: order
        label: Order
        type: number
      - name: featured
        label: Featured
        type: boolean
    format: json
    filename: "{fields.title}.json"
  - name: servicesSettings
    label: Services Settings
    path: src/content/servicesSettings/settings.json
    type: file
    fields:
      - name: id
        type: string
        hidden: true
        default: settings
      - name: heading
        label: Heading
        type: string
      - name: icon
        label: Icon
        type: string
      - name: note
        label: Note
        type: string
      - name: ctaButton
        label: CTA Button
        type: string
    format: json
  - name: testimonials
    label: Testimonials
    path: src/content/testimonials
    type: collection
    fields:
      - name: id
        type: string
        hidden: true
        required: false
      - name: author
        label: Author
        type: string
      - name: rating
        label: Rating
        type: number
      - name: time
        label: Time
        type: string
      - name: text
        label: Text
        type: string
      - name: order
        label: Order
        type: number
    format: json
    filename: "{fields.author}.json"
  - name: testimonialsSettings
    label: Testimonials Settings
    path: src/content/testimonialsSettings/settings.json
    type: file
    fields:
      - name: id
        type: string
        hidden: true
        default: settings
      - name: heading
        label: Heading
        type: string
      - name: ratingScore
        label: Rating Score
        type: string
      - name: ratingLabel
        label: Rating Label
        type: string
      - name: reviewsButton
        label: Reviews Button
        type: string
      - name: reviewsButtonLink
        label: Reviews Link
        type: string
      - name: backgroundImage
        label: Background Image
        type: image
        options:
          media: images
    format: json
  - name: gallery
    label: Gallery
    path: src/content/gallery/settings.json
    type: file
    fields:
      - name: id
        type: string
        hidden: true
        default: settings
      - name: subtitle
        label: Subtitle
        type: string
      - name: heading
        label: Heading
        type: string
      - name: instagramButton
        label: Instagram Button
        type: string
      - name: instagramLink
        label: Instagram Link
        type: string
      - name: instagramVideos
        label: Featured Instagram Reels
        type: object
        fields:
          - name: url
            label: Instagram Reel URL
            type: string
          - name: video
            label: Local Video
            type: file
            options:
              media: videos
          - name: poster
            label: Cover Image
            type: image
            options:
              media: images
          - name: title
            label: Title
            type: string
          - name: views
            label: View Count
            type: string
        list: true
      - name: videos
        label: Gallery Videos
        type: object
        fields:
          - name: video
            label: Video URL
            type: string
          - name: poster
            label: Cover Image
            type: image
            options:
              media: images
          - name: title
            label: Title
            type: string
        list: true
      - name: images
        label: Images
        type: object
        fields:
          - name: image
            label: Image
            type: image
            options:
              media: images
          - name: alt
            label: Alt Text
            type: string
          - name: featured
            label: Featured
            type: boolean
        list: true
    format: json
  - name: booking
